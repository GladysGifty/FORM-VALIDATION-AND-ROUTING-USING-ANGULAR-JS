
<!DOCTYPE html>
<html ng-app="studentApp">
<head>
<title>Student Learning Website</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
<style>
body{font-family:Arial;background:#f1eaff;margin:0}
header{background:#663399;color:white;text-align:center;padding:20px}
nav{background:#8054b8;text-align:center;padding:15px}
nav a{color:white;text-decoration:none;margin:15px;font-weight:bold}
nav a:hover{color:#ffe4ff}
.container{background:white;max-width:850px;margin:30px auto;padding:30px;border-radius:12px;min-height:300px}
h2{color:#663399}
input,select,textarea{box-sizing:border-box;border:1px solid #aaa;border-radius:5px}
button{cursor:pointer}
footer{background:#663399;color:white;text-align:center;padding:15px}
</style>
</head>
<body>
<header>
<h1>Student Learning Website</h1>
<p>Learn, Grow and Achieve</p>
</header>
<nav>
<a href="#!/home">Home</a>
<a href="#!/about">About</a>
<a href="#!/services">Courses</a>
<a href="#!/contact">Contact</a>
</nav>
<div class="container">
<div ng-view></div>
</div>
<footer>
<p>Student Learning Website | 2026</p>
<p>Learn Today, Lead Tomorrow!</p>
</footer>
<script>
var app=angular.module("studentApp",["ngRoute"]);
app.config(function($routeProvider){
$routeProvider
.when("/home",{templateUrl:"home.html"})
.when("/about",{templateUrl:"about.html"})
.when("/services",{templateUrl:"services.html"})
.when("/contact",{templateUrl:"contact.html"})
.otherwise({redirectTo:"/home"});
});
app.controller("contactCtrl",function($scope){
$scope.sendMessage=function(){
$scope.success="Thank you! Your message has been submitted successfully.";
$scope.name="";
$scope.email="";
$scope.course="";
$scope.message="";
};
});
</script>
</body>
</html>
