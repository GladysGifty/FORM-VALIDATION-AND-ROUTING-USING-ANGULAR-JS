
<!DOCTYPE html>
<html ng-app="myApp">
<head>
<title>Form Validation</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<style>
body{font-family:Arial;background:#f1eaff;padding:25px}
.container{background:white;max-width:500px;margin:auto;padding:25px;border-radius:15px;box-shadow:0 0 10px #aaa}
h1{text-align:center;color:#663399}
input,select{width:100%;padding:10px;margin:7px 0;box-sizing:border-box;border:1px solid #aaa;border-radius:5px}
label{font-weight:bold}
.error{color:red;font-size:13px}
button{background:#8054b8;color:white;padding:12px 25px;border:0;border-radius:6px}
button:disabled{background:gray}
</style>
</head>
<body ng-controller="formCtrl">
<div class="container">
<h1>User Registration</h1>
<form name="regForm" ng-submit="submitForm()" novalidate>
<label>Name</label>
<input type="text" name="name" ng-model="user.name" ng-pattern="/^[A-Za-z ]+$/" required>
<span class="error" ng-show="regForm.name.$touched && regForm.name.$error.required">Name is required</span>
<span class="error" ng-show="regForm.name.$touched && regForm.name.$error.pattern">Name should not contain numbers</span>
<label>Password</label>
<input type="password" name="password" ng-model="user.password" ng-pattern="/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/" required>
<span class="error" ng-show="regForm.password.$touched && regForm.password.$invalid">Password must contain uppercase, lowercase, number and 8 characters</span>
<label>Age</label>
<input type="number" name="age" ng-model="user.age" min="18" max="30" required>
<span class="error" ng-show="regForm.age.$touched && regForm.age.$invalid">Age must be between 18 and 30</span>
<label>Mobile Number</label>
<input type="text" name="mobile" ng-model="user.mobile" ng-pattern="/^[0-9]{10}$/" required>
<span class="error" ng-show="regForm.mobile.$touched && regForm.mobile.$invalid">Enter a valid 10-digit mobile number</span>
<label>Email</label>
<input type="email" name="email" ng-model="user.email" required>
<span class="error" ng-show="regForm.email.$touched && regForm.email.$invalid">Enter a valid email address</span>
<label>Gender</label>
<select name="gender" ng-model="user.gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
<span class="error" ng-show="regForm.gender.$touched && regForm.gender.$invalid">Gender is required</span>
<label>State</label>
<select name="state" ng-model="user.state" required>
<option value="">Select State</option>
<option>Tamil Nadu</option>
<option>Kerala</option>
<option>Karnataka</option>
<option>Andhra Pradesh</option>
<option>Telangana</option>
</select>
<span class="error" ng-show="regForm.state.$touched && regForm.state.$invalid">State is required</span>
<br><br>
<button type="submit" ng-disabled="regForm.$invalid">Submit</button>
<p style="color:green" ng-show="success">{{message}}</p>
</form>
</div>
<script>
var app=angular.module("myApp",[]);
app.controller("formCtrl",function($scope){
$scope.user={};
$scope.submitForm=function(){
$scope.success=true;
$scope.message="Registration Successful!";
};
});
</script>
</body>
</html>
